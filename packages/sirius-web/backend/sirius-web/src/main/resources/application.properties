server.port=8080
spring.profiles.default=dev

# Multipart upload size limits (Spring Boot default is 1MB which is too small for project ZIPs)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.datasource.url=jdbc:postgresql://localhost:5432/sirius-web-db
spring.datasource.username=dbuser
spring.datasource.password=dbpwd

# HikariCP connection pool — the upload flow uses up to 4 nested REQUIRES_NEW transactions,
# each holding its own connection.  The default of 10 is insufficient for concurrent uploads
# and causes the Tomcat thread to block indefinitely waiting for a connection.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
# Fail fast (30 s) instead of blocking forever if the pool is truly exhausted.
spring.datasource.hikari.connection-timeout=30000

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/db.changelog-master.xml

sirius.web.enabled=*
sirius.components.cors.allowedOriginPatterns=*
sirius.components.cors.allowedCredentials=true
sirius.components.cors.allowedMethods=GET,HEAD,POST,PUT,DELETE,OPTIONS

sirius.web.graphql.tracing=true
logging.group.sirius.web.performance=org.eclipse.sirius.web.application.editingcontext.services.EditingContextSearchService,org.eclipse.sirius.web.application.editingcontext.services.EditingContextPersistenceService,org.eclipse.sirius.components.collaborative.editingcontext.EditingContextEventProcessor,org.eclipse.sirius.components.interpreter.AQLInterpreter
logging.level.org.eclipse.sirius.web.application.graphql.logging=INFO
logging.level.org.eclipse.sirius.components.collaborative.diagrams.handlers=INFO

# Prevent Elasticsearch from scanning Sirius Web repositories
spring.data.elasticsearch.repositories.enabled=false
management.health.elasticsearch.enabled=false

# Persist logs to disk
logging.file.name=logs/sirius-web.log

# Enable Spring Boot devtools restart for hot reload
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# Disable non-EDT project templates
edt.project.templates.only=true

# Default Locale
spring.mvc.locale=zh_CN

# Bootstrap administrator account
app.security.bootstrap-admin.username=admin
app.security.bootstrap-admin.password=admin123456
app.security.bootstrap-admin.display-name=System Administrator

# ECOA integration defaults for local debugging:
# - sirius-web runs on the host
# - ecoa-tools runs in docker-compose.dev.yml and is exposed on localhost:5000
# - callback from ecoa-tools container reaches the host through host.docker.internal
ecoa.python.generator.url=http://localhost:5000
ecoa.workspace.dir=/Users/admin/code/sirius-web-ecoa/workspace
ecoa.backend.url=http://host.docker.internal:8080
