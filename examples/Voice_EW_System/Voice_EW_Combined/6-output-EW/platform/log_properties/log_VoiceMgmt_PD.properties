log4cplus.rootLogger=TRACE 
log4cplus.logger.VoiceMgmt_PD=TRACE,VoiceMgmt_PD_appender
log4cplus.appender.VoiceMgmt_PD_appender=log4cplus::RollingFileAppender
log4cplus.appender.VoiceMgmt_PD_appender.File=logs/log_VoiceMgmt_PD.log
log4cplus.appender.VoiceMgmt_PD_appender.CreateDirs=true
log4cplus.appender.VoiceMgmt_PD_appender.Append=false
log4cplus.appender.VoiceMgmt_PD_appender.MaxBackupIndex=10
log4cplus.appender.VoiceMgmt_PD_appender.MaxFileSize=3MB
log4cplus.appender.VoiceMgmt_PD_appender.layout=log4cplus::PatternLayout
log4cplus.appender.VoiceMgmt_PD_appender.layout.ConversionPattern=%m%n
