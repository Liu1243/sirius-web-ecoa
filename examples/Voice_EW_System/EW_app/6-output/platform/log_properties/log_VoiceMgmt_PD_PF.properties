log4cplus.rootLogger=TRACE 
log4cplus.logger.VoiceMgmt_PD_PF=TRACE,VoiceMgmt_PD_PF_appender
log4cplus.appender.VoiceMgmt_PD_PF_appender=log4cplus::RollingFileAppender
log4cplus.appender.VoiceMgmt_PD_PF_appender.File=logs/log_VoiceMgmt_PD_PF.log
log4cplus.appender.VoiceMgmt_PD_PF_appender.CreateDirs=true
log4cplus.appender.VoiceMgmt_PD_PF_appender.Append=false
log4cplus.appender.VoiceMgmt_PD_PF_appender.MaxBackupIndex=10
log4cplus.appender.VoiceMgmt_PD_PF_appender.MaxFileSize=3MB
log4cplus.appender.VoiceMgmt_PD_PF_appender.layout=log4cplus::PatternLayout
log4cplus.appender.VoiceMgmt_PD_PF_appender.layout.ConversionPattern=%m%n
